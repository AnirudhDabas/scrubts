- id: anthropic-claude-text-watermark
  title: How Claude's text watermark works
  organization: Anthropic
  publication_date: 2026-08-14
  kind: vendor-technical-documentation
  url: https://www.anthropic.com/news/claude-text-watermark
  authority: primary
  integration: documentation
  verified: 2026-08-14
  retrieved: 2026-08-15T03:52:39.6392209Z
  used_for:
  - claude-mechanism-family
  - claude-provider-key-state
  - claude-detector-api-state
  - claude-vendor-reported-claims
  authoritative_for:
  - Anthropic's statement that Claude's text watermark is a version of the SynthID-Text approach
  - Anthropic's statement that detection uses its key and that its detection API is forthcoming
  - Anthropic's descriptions of intended supported-output behavior and limitations
  claims:
  - Nothing is appended to the text and the watermark does not use hidden characters.
  - Detection uses Anthropic's key and estimates the likelihood that Claude was partly involved.
  - Short, factual, low-choice, lightly edited, and much code content can provide less signal.
  - More Claude-authored text provides more opportunity for signal.
  - Claude-produced translations are watermarked; light editing may retain signal while a complete rewrite can remove it.
  - Anthropic reports no practical quality impact in its internal testing.
  claim_classification: vendor-reported
  claims_to_test:
  - claim: Detectability increases with more Claude-selected text.
    waterlarp_axes: [evidence-length, mixed-authorship, marked-fraction]
  - claim: Factual and low-choice text provides less watermarking opportunity.
    waterlarp_axes: [base-entropy, task-domain]
  - claim: Code generally provides less signal where exact token choices matter.
    waterlarp_axes: [code, base-entropy, task-domain]
  - claim: Editing and complete rewriting affect signal differently.
    waterlarp_axes: [transformations, quality-integrity]
  - claim: Claude-produced translations carry the watermark.
    waterlarp_axes: [translation, quality-integrity]
  limitations:
  - The article does not disclose Claude's exact deployed configuration, key, detector statistic, threshold, false-positive target, repetition handling, or API contract.
  - It does not establish deployment parity with google-deepmind/synthid-text, Transformers, or WaterLARP.
  - Provider-reported quality, robustness, and detectability statements are not WaterLARP measurements or replications.
  revision: "published 2026-08-14; retrieved 2026-08-15T03:52:39.6392209Z; HTTP 200; 154,380-byte UTF-8 HTML representation; SHA-256 947cf1ebabdd41655ece7e03d2ee02694f462c18a50af6aabef78e2bcd2ffaa0"
  license: documentation-terms; metadata, hash, and project-authored notes only
- id: anthropic-claude-marking
  title: How Claude marks AI-generated content
  organization: Anthropic
  kind: vendor-doc
  url: https://support.claude.com/en/articles/16266773-how-claude-marks-ai-generated-content
  authority: primary
  integration: documentation
  verified: 2026-08-14
  retrieved: 2026-08-15T03:52:39.6392209Z
  used_for:
  - claude-scope
  - claude-limitations
  claims:
  - Supported Claude-generated text may contain embedded watermarks applied at the model level.
  - Supported generated files carry signed C2PA provenance metadata where supported.
  - Anthropic intends to support users and third parties in detecting these marks.
  - A detected mark indicates content may have been processed by Claude.
  - Absence of a detected mark does not establish that content was not AI-generated or processed.
  limitations:
  - Detection details remain forthcoming; this Help Center source does not publish a detector, key, configuration, threshold, or API contract.
  - Heavy editing, paraphrasing, translation of existing marked text, mixing, and short passages can make a mark undetectable; lack of detection is not absence or human authorship.
  revision: "retrieved 2026-08-15T03:52:39.6392209Z; HTTP 200; 338,075-byte UTF-8 HTML representation; SHA-256 01de813d13cd0de0b962da05819265dab64e291b877bcd8560b82b9be82a7277; detection details still forthcoming"
  license: documentation-terms; metadata, hash, and project-authored notes only
