[package]
name = "scrub-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
scrub = { path = "../crates/scrub" }
scrub-report = { path = "../crates/scrub-report" }
serde_json = "1.0.151"

[[bin]]
name = "streaming_partition_equivalence"
path = "fuzz_targets/streaming_partition_equivalence.rs"
test = false
doc = false
bench = false

[[bin]]
name = "report_json_import"
path = "fuzz_targets/report_json_import.rs"
test = false
doc = false
bench = false

[[bin]]
name = "human_output_escape"
path = "fuzz_targets/human_output_escape.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
