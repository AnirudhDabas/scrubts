name: cross-platform semantic determinism

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform-digest:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
          - platform: macos
            runner: macos-15
          - platform: windows
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    env:
      RUST_TOOLCHAIN: 1.97.1
    steps:
      - name: Check out exact fixture bytes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build scrub and generate canonical semantic digests
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          cargo +"$RUST_TOOLCHAIN" run --locked -p scrub --example determinism -- \
            --manifest evidence/determinism-fixtures.json \
            --platform "${{ matrix.platform }}" \
            --project-revision "${{ github.sha }}" \
            --output target/determinism/determinism-platform.json

      - name: Upload platform result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: determinism-${{ matrix.platform }}
          path: target/determinism/determinism-platform.json
          if-no-files-found: error
          retention-days: 14

  compare-platforms:
    needs: platform-digest
    runs-on: ubuntu-24.04
    steps:
      - name: Check out comparator and schemas
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all three platform results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: determinism-*
          path: target/determinism/downloads

      - name: Validate identities and compare semantic digests
        run: >-
          python tools/compare_determinism.py
          --input target/determinism/downloads
          --output target/determinism/determinism-matrix.json

      - name: Upload compared matrix
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: determinism-matrix
          path: target/determinism/determinism-matrix.json
          if-no-files-found: warn
          retention-days: 14
