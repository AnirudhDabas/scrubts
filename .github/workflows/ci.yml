name: core CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: 1.97.1

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy

      - name: Run core quality gate
        run: |
          cargo +"$RUST_TOOLCHAIN" fmt --check
          cargo +"$RUST_TOOLCHAIN" clippy --locked --workspace --all-targets -- -D warnings
          cargo +"$RUST_TOOLCHAIN" test --locked --workspace
